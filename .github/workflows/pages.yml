name: Test and deploy WiiClipse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch pinned verified native core
        run: node scripts/fetch-core.mjs
      - run: npm run verify
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Verify Chromium frame scheduling
        run: node tests/scheduler-browser.mjs
      - name: Verify WebKit frame scheduling
        run: node tests/scheduler-browser.mjs
        env:
          SMOKE_BROWSER: webkit
      - name: Check Chromium startup and native boot when available
        shell: bash
        run: |
          if [[ -f native/core-release.json ]]; then
            export EXPECT_CORE_READY=1
          fi
          npm run test:browser
      - name: Check WebKit startup and native boot when available
        shell: bash
        run: |
          if [[ -f native/core-release.json ]]; then
            export EXPECT_CORE_READY=1
          fi
          npm run test:browser
        env:
          SMOKE_BROWSER: webkit
      - name: Verify WebGL pixel uploads and resizing
        run: node tests/renderer-browser.mjs
      - name: Check Firefox startup and native boot
        env:
          SMOKE_BROWSER: firefox
          EXPECT_CORE_READY: '1'
        run: npm run test:browser
      - name: Verify browser audio streaming
        run: node tests/browser-audio.mjs
      - name: Verify WebKit audio streaming
        run: node tests/browser-audio.mjs
        env:
          SMOKE_BROWSER: webkit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
