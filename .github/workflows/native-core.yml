name: Build experimental Dolphin core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMSCRIPTEN_VERSION: 4.0.23
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build python3 git pkg-config
      - name: Install pinned Emscripten compiler
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Compile native browser core
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          set -o pipefail
          bash native/build-dolphin-wasm.sh 2>&1 | tee native-build.log
      - name: Upload native build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: native-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload compiled core
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-browser-core
          path: public/core/
          if-no-files-found: error
          retention-days: 14
