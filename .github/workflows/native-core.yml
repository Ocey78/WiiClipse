name: Build experimental Dolphin core

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Compiler profile for measured core comparisons
        type: choice
        default: optimized
        options:
          - optimized
          - baseline
          - diagnostic
          - compiled

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMSCRIPTEN_VERSION: 4.0.23
      DWEB_BUILD_PROFILE: ${{ inputs.profile }}
      CCACHE_DIR: ${{ github.workspace }}/native/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build python3 git pkg-config ccache
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: native/.ccache
          key: native-${{ runner.os }}-emscripten-${{ env.EMSCRIPTEN_VERSION }}-${{ github.run_id }}
          restore-keys: native-${{ runner.os }}-emscripten-${{ env.EMSCRIPTEN_VERSION }}-
      - name: Install pinned Emscripten compiler
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Compile native browser core
        id: native-compile
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          set -o pipefail
          bash native/build-dolphin-wasm.sh 2>&1 | tee native-build.log
      - name: Report compiler cache statistics
        if: always() && steps.native-compile.outcome != 'skipped'
        run: ccache --show-stats
      - name: Retain unverified core for browser diagnostics
        if: steps.native-compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-browser-core-unverified
          path: public/core/
          if-no-files-found: error
          retention-days: 3
      - name: Verify native host contracts
        run: |
          c++ -std=c++17 -I native/.build/dolphin/Source/Core native/tests/software-frame.cpp -o "$RUNNER_TEMP/software-frame-test"
          "$RUNNER_TEMP/software-frame-test"
          c++ -std=c++17 -pthread -I native/.build/dolphin/Externals/libretro-common/include -I native/tests/stubs native/tests/browser-boot.cpp -o "$RUNNER_TEMP/browser-boot-test"
          "$RUNNER_TEMP/browser-boot-test"
          python3 native/tests/extract-integer-reference.py native/.build/dolphin "$RUNNER_TEMP/integer-reference.h"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP" native/tests/browser-integer.cpp -o "$RUNNER_TEMP/browser-integer"
          "$RUNNER_TEMP/browser-integer"
          python3 native/tests/extract-interpreter-dispatch.py native/.build/dolphin "$RUNNER_TEMP/interpreter-dispatch"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/interpreter-dispatch" native/tests/browser-direct-interpreter-dispatch.cpp -o "$RUNNER_TEMP/browser-direct-interpreter-dispatch"
          "$RUNNER_TEMP/browser-direct-interpreter-dispatch"
          python3 native/tests/extract-callback-dispatch.py native/.build/dolphin "$RUNNER_TEMP/callback-dispatch"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/callback-dispatch" native/tests/browser-callback-dispatch.cpp -o "$RUNNER_TEMP/browser-callback-dispatch"
          "$RUNNER_TEMP/browser-callback-dispatch"
          python3 native/tests/extract-memcheck-guard.py native/.build/dolphin "$RUNNER_TEMP/memcheck-guard"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/memcheck-guard" native/tests/browser-memcheck-guard.cpp -o "$RUNNER_TEMP/browser-memcheck-guard"
          "$RUNNER_TEMP/browser-memcheck-guard"
          python3 native/tests/extract-cache-flush-loop.py native/.build/dolphin "$RUNNER_TEMP/cache-flush-loop"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/cache-flush-loop" native/tests/browser-cache-flush-loop.cpp -o "$RUNNER_TEMP/browser-cache-flush-loop"
          "$RUNNER_TEMP/browser-cache-flush-loop"
          python3 native/tests/extract-ram-fastpath.py native/.build/dolphin "$RUNNER_TEMP/ram-fastpath"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/ram-fastpath" native/tests/browser-ram-fastpath.cpp -o "$RUNNER_TEMP/browser-ram-fastpath"
          "$RUNNER_TEMP/browser-ram-fastpath"
          python3 native/tests/extract-interpreter-runs.py native/.build/dolphin "$RUNNER_TEMP/interpreter-runs"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/interpreter-runs" native/tests/browser-interpreter-runs.cpp -o "$RUNNER_TEMP/browser-interpreter-runs"
          "$RUNNER_TEMP/browser-interpreter-runs"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core native/tests/browser-compiler-gate.cpp -o "$RUNNER_TEMP/browser-compiler-gate"
          "$RUNNER_TEMP/browser-compiler-gate"
          python3 native/tests/extract-compiler-descriptor.py native/.build/dolphin "$RUNNER_TEMP/compiler-descriptor"
          python3 native/tests/extract-compiler-branch.py native/.build/dolphin "$RUNNER_TEMP/compiler-branch"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/interpreter-dispatch" -I "$RUNNER_TEMP/compiler-branch" native/tests/browser-compiler-branch.cpp -o "$RUNNER_TEMP/compiler-branch-test"
          "$RUNNER_TEMP/compiler-branch-test"
          c++ -std=c++20 -O2 -DTEST_BROWSER_COMPILER_FPU -DTEST_BROWSER_COMPILER_FAST_GATE -DTEST_BROWSER_COMPILER_END -DTEST_BROWSER_COMPILER_RUN -DTEST_BROWSER_COMPILER_NATIVE_CR -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/interpreter-dispatch" -I "$RUNNER_TEMP/compiler-descriptor" -I "$RUNNER_TEMP/compiler-branch" native/tests/browser-compiler-descriptor.cpp -o "$RUNNER_TEMP/browser-compiler-descriptor"
          "$RUNNER_TEMP/browser-compiler-descriptor"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/compiler-descriptor" native/tests/browser-compiler-chain.cpp -o "$RUNNER_TEMP/browser-compiler-chain"
          "$RUNNER_TEMP/browser-compiler-chain"
          python3 native/tests/extract-compiler-fpu.py native/.build/dolphin "$RUNNER_TEMP/compiler-fpu"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/compiler-fpu" native/tests/browser-compiler-fpu.cpp -o "$RUNNER_TEMP/browser-compiler-fpu"
          "$RUNNER_TEMP/browser-compiler-fpu"
          python3 native/tests/extract-compiler-end.py native/.build/dolphin "$RUNNER_TEMP/compiler-end"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/compiler-end" native/tests/browser-compiler-end.cpp -o "$RUNNER_TEMP/browser-compiler-end"
          "$RUNNER_TEMP/browser-compiler-end"
          python3 native/tests/extract-compiler-instruction.py native/.build/dolphin "$RUNNER_TEMP/compiler-instruction"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP/interpreter-dispatch" -I "$RUNNER_TEMP/compiler-instruction" native/tests/browser-compiler-instruction.cpp -o "$RUNNER_TEMP/browser-compiler-instruction"
          "$RUNNER_TEMP/browser-compiler-instruction"
          python3 native/tests/extract-video-lifecycle.py native/.build/dolphin "$RUNNER_TEMP/video-lifecycle-reference.h"
          c++ -std=c++17 -O2 -D__EMSCRIPTEN__ -D__LIBRETRO__ -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP" native/tests/browser-video-lifecycle.cpp -o "$RUNNER_TEMP/video-lifecycle"
          "$RUNNER_TEMP/video-lifecycle"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify native browser media boundary
        run: node --test native/tests/browser-media.test.mjs
      - name: Verify browser uniform block alignment
        run: node native/tests/browser-uniforms.test.mjs
      - name: Verify browser streaming buffer uploads
        run: node native/tests/browser-streaming.test.mjs
      - name: Verify optional browser CPU diagnostics
        run: node native/tests/browser-cpu-profile.test.mjs
      - run: npm run verify
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify compiled blocks, fallback, and reload in the real browser core
        if: inputs.profile == 'compiled'
        run: |
          node native/tests/browser-compiler-browser.mjs
          COMPILER_PROBE=fp COMPILER_OUT=native-performance/compiler-fpu-browser.json node native/tests/browser-compiler-browser.mjs
      - name: Verify browser frame scheduling
        run: node tests/scheduler-browser.mjs
      - name: Verify browser renderer pixels and resizing
        run: node tests/renderer-browser.mjs
      - name: Verify browser GPU staging transfers
        run: node native/tests/webgl2-staging-browser.mjs
      - name: Boot original GameCube DOL and Wii WAD in Chromium
        env:
          EXPECT_CORE_READY: '1'
          SMOKE_EXPECT_GPU: '1'
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee native-browser-smoke.log
      - name: Verify native software fallback when worker GPU is unavailable
        env:
          EXPECT_CORE_READY: '1'
          SMOKE_DISABLE_WORKER_GPU: '1'
        run: npm run test:browser
      - name: Verify browser audio streaming
        run: node tests/browser-audio.mjs
      - name: Install Firefox virtual display, graphics, and audio output
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri libegl-mesa0 libglx-mesa0 pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=wiiclipse rate=48000 channels=2
          pactl set-default-sink wiiclipse
      - name: Boot original DOL and WAD in Firefox under Xvfb
        env:
          EXPECT_CORE_READY: '1'
          SMOKE_BROWSER: firefox
          SMOKE_HEADED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          PULSE_SINK: wiiclipse
        run: xvfb-run -a npm run test:browser
      - name: Verify original GX depth blending and sustained draws
        run: |
          mkdir -p native-performance
          PERF_CASE=gx PERF_RENDERER=software PERF_FRAMES=30 PERF_OUT=native-performance/gx-software.json node tests/browser-performance.mjs
          PERF_CASE=gx PERF_RENDERER=hardware PERF_FRAMES=30 PERF_OUT=native-performance/gx-hardware.json node tests/browser-performance.mjs
      - name: Compare compute throughput with pinned release
        env:
          PERF_RENDERER: software
        run: node native/tests/compare-core-performance.mjs
      - name: Upload native performance comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-comparison
          path: native-performance/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload native diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            native-build.log
            native-browser-smoke.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: native/.ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload compiled core
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-browser-core
          path: public/core/
          if-no-files-found: error
          retention-days: 14
      - name: Package verified core and corresponding source
        if: inputs.profile != 'diagnostic' && inputs.profile != 'compiled'
        run: node scripts/package-native-release.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.profile != 'diagnostic' && inputs.profile != 'compiled'
        with:
          name: verified-native-release
          path: native-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.profile != 'diagnostic' && inputs.profile != 'compiled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-native-release
          path: native-release
      - name: Publish immutable verified core release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(jq -r .tag native-release/native-core-release.json)
          HOST_COMMIT=$(jq -r .hostCommit native-release/native-core-release.json)
          gh release create "$TAG" \
            native-release/dolphin-core.* \
            native-release/dolphin-browser-source.tar.gz \
            native-release/native-core-release.json \
            native-release/SHA256SUMS.txt \
            --target "$HOST_COMMIT" --prerelease --latest=false \
            --title "Experimental browser core $TAG" \
            --notes-file native-release/release-notes.md
