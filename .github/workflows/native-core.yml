name: Build experimental Dolphin core

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Compiler profile for measured core comparisons
        type: choice
        default: optimized
        options:
          - optimized
          - baseline

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMSCRIPTEN_VERSION: 4.0.23
      DWEB_BUILD_PROFILE: ${{ inputs.profile }}
      CCACHE_DIR: ${{ github.workspace }}/native/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build python3 git pkg-config ccache
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: native/.ccache
          key: native-${{ runner.os }}-emscripten-${{ env.EMSCRIPTEN_VERSION }}-${{ github.run_id }}
          restore-keys: native-${{ runner.os }}-emscripten-${{ env.EMSCRIPTEN_VERSION }}-
      - name: Install pinned Emscripten compiler
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Compile native browser core
        id: native-compile
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          set -o pipefail
          bash native/build-dolphin-wasm.sh 2>&1 | tee native-build.log
      - name: Report compiler cache statistics
        if: always() && steps.native-compile.outcome != 'skipped'
        run: ccache --show-stats
      - name: Retain unverified core for browser diagnostics
        if: steps.native-compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-browser-core-unverified
          path: public/core/
          if-no-files-found: error
          retention-days: 3
      - name: Verify native host contracts
        run: |
          c++ -std=c++17 -I native/.build/dolphin/Source/Core native/tests/software-frame.cpp -o "$RUNNER_TEMP/software-frame-test"
          "$RUNNER_TEMP/software-frame-test"
          c++ -std=c++17 -pthread -I native/.build/dolphin/Externals/libretro-common/include -I native/tests/stubs native/tests/browser-boot.cpp -o "$RUNNER_TEMP/browser-boot-test"
          "$RUNNER_TEMP/browser-boot-test"
          python3 native/tests/extract-integer-reference.py native/.build/dolphin "$RUNNER_TEMP/integer-reference.h"
          c++ -std=c++20 -O2 -I native/.build/dolphin/Source/Core -I "$RUNNER_TEMP" native/tests/browser-integer.cpp -o "$RUNNER_TEMP/browser-integer"
          "$RUNNER_TEMP/browser-integer"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify native browser media boundary
        run: node --test native/tests/browser-media.test.mjs
      - run: npm run verify
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify browser frame scheduling
        run: node tests/scheduler-browser.mjs
      - name: Verify browser renderer pixels and resizing
        run: node tests/renderer-browser.mjs
      - name: Verify browser GPU staging transfers
        run: node native/tests/webgl2-staging-browser.mjs
      - name: Boot original GameCube DOL and Wii WAD in Chromium
        env:
          EXPECT_CORE_READY: '1'
          SMOKE_EXPECT_GPU: '1'
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee native-browser-smoke.log
      - name: Verify native software fallback when worker GPU is unavailable
        env:
          EXPECT_CORE_READY: '1'
          SMOKE_DISABLE_WORKER_GPU: '1'
        run: npm run test:browser
      - name: Verify browser audio streaming
        run: node tests/browser-audio.mjs
      - name: Boot original DOL and WAD in Firefox
        env:
          EXPECT_CORE_READY: '1'
          SMOKE_BROWSER: firefox
        run: npm run test:browser
      - name: Verify original GX depth blending and sustained draws
        run: |
          mkdir -p native-performance
          PERF_CASE=gx PERF_RENDERER=software PERF_FRAMES=30 PERF_OUT=native-performance/gx-software.json node tests/browser-performance.mjs
          PERF_CASE=gx PERF_RENDERER=hardware PERF_FRAMES=30 PERF_OUT=native-performance/gx-hardware.json node tests/browser-performance.mjs
      - name: Compare compute throughput with pinned release
        env:
          PERF_RENDERER: software
        run: node native/tests/compare-core-performance.mjs
      - name: Upload native performance comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-comparison
          path: native-performance/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload native diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            native-build.log
            native-browser-smoke.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: native/.ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload compiled core
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-browser-core
          path: public/core/
          if-no-files-found: error
          retention-days: 14
      - name: Package verified core and corresponding source
        run: node scripts/package-native-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-release
          path: native-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-native-release
          path: native-release
      - name: Publish immutable verified core release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(jq -r .tag native-release/native-core-release.json)
          HOST_COMMIT=$(jq -r .hostCommit native-release/native-core-release.json)
          gh release create "$TAG" \
            native-release/dolphin-core.* \
            native-release/dolphin-browser-source.tar.gz \
            native-release/native-core-release.json \
            native-release/SHA256SUMS.txt \
            --target "$HOST_COMMIT" --prerelease --latest=false \
            --title "Experimental browser core $TAG" \
            --notes-file native-release/release-notes.md
